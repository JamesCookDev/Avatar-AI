version: "3.8"

services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: whisper_local
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      TZ: "America/Belem"
      ASR_ENGINE: "openai_whisper"
      
      # MANTEMOS 'small' PARA INTELIGÊNCIA (contexto)
      ASR_MODEL: "small"
      
      # SEGURANÇA DE MEMÓRIA
      ASR_DEVICE: "cuda"
      ASR_QUANTIZATION: "float32"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper_hf_cache:
  whisper_torch_cache:
  whisper_hf_home: